{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card-modern p-5 mx-auto" style="max-width: 540px;">
        <div class="brand-icon-box mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
            <i class="bi bi-question-diamond-fill" aria-hidden="true"></i>
        </div>
        <h2 class="fw-bold text-main mb-2">404 - Page Not Found</h2>
        <p class="text-secondary small mb-4">
            The resource, page, or analysis record you requested does not exist or has been moved.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-brand rounded-pill px-4">
                <i class="bi bi-house-door me-1" aria-hidden="true"></i> Back to Home
            </a>
            <a href="{{ url_for('detect') }}" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-cpu me-1" aria-hidden="true"></i> Analyze Image
            </a>
        </div>
    </div>
</div>
{% endblock %}
